<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precificação PMA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0eb;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Mono',monospace}
#gate{background:#fff;border:1px solid #ddd;border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,0.08)}
#gate h2{font-size:15px;letter-spacing:0.12em;text-transform:uppercase;color:#3d3530;margin-bottom:6px}
#gate p{font-size:11px;color:#888;margin-bottom:28px;letter-spacing:0.04em}
#gate input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'DM Mono',monospace;font-size:13px;text-align:center;letter-spacing:0.08em;outline:none;margin-bottom:14px;background:#faf8f6;color:#3d3530}
#gate input:focus{border-color:#8b7355}
#gate button{width:100%;padding:11px;background:#3d3530;color:#f5f0eb;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer}
#gate button:hover{background:#5c4a3a}
#err{color:#c0392b;font-size:11px;margin-top:10px;min-height:16px;letter-spacing:0.04em}
#exp{color:#888;font-size:10px;margin-top:18px;letter-spacing:0.04em}
</style>

<body>
<div id="gate">

</div>

})();
